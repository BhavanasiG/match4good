project_name: MatchForGood (current consideration)

project_description: |
  MatchForGood is a platform focusing on generating social impact through volunteer contributions. This project enables charities to contribute to the good health and wellbeing of the communities (3) and reducing inequalities both in and through volunteering work (10). Our clients are dedicated to improving social outcomes for all. We connect outstanding volunteers with high impact organisations.

